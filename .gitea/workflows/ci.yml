name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group server
      # no unit tests yet: the app must at least import (model + DB load in lifespan)
      - run: uv run python -c "import server.app"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: catthehacker/ubuntu:act-latest
      volumes: [/var/run/docker.sock:/var/run/docker.sock]
    steps:
      - uses: actions/checkout@v4
      - name: build, push, promote (shared deploy.sh, WP-53)
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          INFRA_DEPLOY_KEY: ${{ secrets.INFRA_DEPLOY_KEY }}
          INFRA_REPO_URL: ${{ secrets.INFRA_REPO_URL }}
          INFRA_KNOWN_HOSTS: ${{ secrets.INFRA_KNOWN_HOSTS }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: curl -fsSL https://git.clockmost.com/Benylin/ci-workflows/raw/branch/main/deploy.sh | bash -s -- poe2rag
